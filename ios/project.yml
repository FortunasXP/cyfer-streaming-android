name: Cyfer
options:
  bundleIdPrefix: app.cyfer.streaming
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
targets:
  Cyfer:
    type: application
    platform: iOS
    sources:
      - path: Cyfer
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cyfer.streaming.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Cyfer
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # Files dropped on the phone from Finder or the Files app show up in the launcher.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIViewControllerBasedStatusBarAppearance: true
schemes:
  Cyfer:
    build:
      targets:
        Cyfer: all
    run:
      # Release on the phone: debug builds are what the stutter reports came from on Android.
      config: Release
      # MoltenVK trips Metal API validation on HDR frames (KhronosGroup/MoltenVK#2226).
      enableGPUValidationMode: false
    archive:
      config: Release
